name: Corporate Actions and News Alert

on:
  schedule:
    # Every 15 minutes, 9:30 AM to 7:00 PM IST (04:00-13:30 UTC), weekdays only
    - cron: '*/15 4-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write  # needed to save "already seen" memory files back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Check for corporate actions and news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python corporate_news_alert.py

      - name: Save updated memory files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_announcements.json seen_news.json
          git diff --staged --quiet || git commit -m "Update seen alerts"
          git push
